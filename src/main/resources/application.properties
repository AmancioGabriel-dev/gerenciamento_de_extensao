# ============================================================
#  Configuracao da aplicacao Spring Boot
# ============================================================

spring.application.name=gerenciamento-de-extensao

# ---------- Banco de dados H2 (em memoria) ----------
# A URL "mem:extensao" cria um banco que vive so enquanto a aplicacao roda.
spring.datasource.url=jdbc:h2:mem:extensao;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------- JPA / Hibernate ----------
# create-drop: cria as tabelas ao subir e apaga ao desligar (ideal pra estudo).
spring.jpa.hibernate.ddl-auto=create-drop
# Mostra no console o SQL que o Hibernate gera (otimo pra aprender).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Console web do H2 ----------
# Acesse http://localhost:8080/h2-console para ver as tabelas e rodar SQL.
# JDBC URL no console: jdbc:h2:mem:extensao
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- Servidor ----------
server.port=8080
