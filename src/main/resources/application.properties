# ============================================================
#  Configuracao da aplicacao Spring Boot
# ============================================================

spring.application.name=gerenciamento-de-extensao

# ---------- Banco de dados SQLite (arquivo unico) ----------
# Cria o arquivo "extensao.db" na raiz do projeto. Os dados PERSISTEM
# entre reinicios (diferente do H2 em memoria, que zerava tudo).
spring.datasource.url=jdbc:sqlite:extensao.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ---------- JPA / Hibernate ----------
# Dialeto do SQLite (vem do modulo hibernate-community-dialects).
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# update: cria as tabelas na 1a vez e MANTEM os dados nas proximas execucoes.
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL que o Hibernate gera (otimo pra aprender).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Servidor ----------
server.port=8080
